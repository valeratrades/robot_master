jobs:
  other:
    runs-on: ubuntu-latest
    steps:
      - env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        name: Ensure GITLAB_TOKEN secret is configured
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::Secret 'GITLAB_TOKEN' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'GITLAB_TOKEN' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set GITLAB_TOKEN -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a GitLab access token with 'write_repository' scope (GitLab → Settings → Access Tokens)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Configure GitLab mirror settings
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mirror_url="https://gitlab.isima.fr/vasakharov/${repo_name}.git"
          gitlab_host=$(echo "https://gitlab.isima.fr/vasakharov" | sed -E 's|https?://([^/]+).*|\1|')
          project_path=$(echo "https://gitlab.isima.fr/vasakharov/${repo_name}" | sed -E 's|https?://[^/]+/(.+)|\1|' | sed 's|/|%2F|g')
          github_url="https://github.com/${{ github.repository }}"

          # Disable issues, MRs, wiki, etc. and set description pointing to GitHub
          curl -sf --max-time 30 --retry 2 --request PUT \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{
              "lfs_enabled": false,
              "issues_access_level": "disabled",
              "merge_requests_access_level": "disabled",
              "wiki_access_level": "disabled",
              "builds_access_level": "disabled",
              "snippets_access_level": "disabled",
              "description": "Mirror of '"${github_url}"'. All development happens on GitHub."
            }' \
            "https://${gitlab_host}/api/v4/projects/${project_path}" > /dev/null || true
      - name: Push to GitLab mirror
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mirror_url="https://gitlab.isima.fr/vasakharov/${repo_name}.git"
          gitlab_host=$(echo "https://gitlab.isima.fr/vasakharov" | sed -E 's|https?://([^/]+).*|\1|')
          github_url="https://github.com/${{ github.repository }}"

          # Configure git credentials
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${gitlab_host}" > ~/.git-credentials

          # Configure git user for the mirror commit
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Add mirror notice to README if not already present
          if [ -f "README.md" ]; then
            if ! grep -q "This is a mirror" README.md; then
              # Prepend mirror notice
              {
                echo '> [!NOTE]'
                echo "> This is a mirror. Development happens on [GitHub](${github_url})."
                echo ""
                cat README.md
              } > README.md.tmp && mv README.md.tmp README.md
              git add README.md
              git commit -m "chore: add mirror notice to README" --allow-empty || true
            fi
          fi

          # Add GitLab remote
          git remote add gitlab "${mirror_url}"

          # Push all branches and tags
          # Skip LFS during push to avoid failures from missing historical objects,
          # then push available LFS objects separately (best-effort)
          GIT_LFS_SKIP_PUSH=1 git push gitlab --all --force
          GIT_LFS_SKIP_PUSH=1 git push gitlab --tags --force
          git lfs push --all gitlab || true

          # Cleanup credentials
          rm -f ~/.git-credentials
name: Sync to GitLab Mirror
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch: {}
permissions:
  contents: read
